<!doctype html>
<html>
    <head>
        <title>Hevy Scraper</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 320px;
                font-family:
                    "Segoe UI",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #0d0d0d;
                color: #e0e0e0;
                padding: 20px;
            }

            .header {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 16px;
            }

            .logo {
                width: 36px;
                height: 36px;
                background: linear-gradient(135deg, #4ade80, #06b6d4);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                font-weight: bold;
                color: #0d0d0d;
            }

            .title {
                font-size: 16px;
                font-weight: 700;
                color: #ffffff;
                letter-spacing: -0.3px;
            }

            .subtitle {
                font-size: 11px;
                color: #888;
                margin-top: 1px;
            }

            .divider {
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    #333,
                    transparent
                );
                margin: 14px 0;
            }

            .info {
                font-size: 12px;
                color: #999;
                line-height: 1.5;
                margin-bottom: 16px;
            }

            .info strong {
                color: #4ade80;
            }

            .columns {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 16px;
            }

            .tag {
                font-size: 10px;
                padding: 3px 8px;
                background: #1a1a1a;
                border: 1px solid #2a2a2a;
                border-radius: 20px;
                color: #aaa;
            }

            #start {
                width: 100%;
                padding: 12px 0;
                font-size: 14px;
                font-weight: 600;
                color: #0d0d0d;
                background: linear-gradient(135deg, #4ade80, #22d3ee);
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.2s ease;
                letter-spacing: 0.3px;
            }

            #start:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 16px rgba(74, 222, 128, 0.3);
            }

            #start:active {
                transform: translateY(0);
                box-shadow: none;
            }

            .footer {
                margin-top: 14px;
                text-align: center;
                font-size: 10px;
                color: #555;
            }

            .footer a {
                color: #4ade80;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="logo">H</div>
            <div>
                <div class="title">Hevy Exercise Scraper</div>
                <div class="subtitle">Export exercise data to CSV</div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="info">
            Navigate to <strong>hevy.com/exercise</strong>, then click the
            button below. The scraper will click each exercise, open the
            <strong>How To</strong> tab, and extract data automatically.
        </div>

        <div class="columns">
            <span class="tag">name</span>
            <span class="tag">equipment</span>
            <span class="tag">primary_muscle</span>
            <span class="tag">secondary_muscle</span>
            <span class="tag">video</span>
            <span class="tag">thumbnail</span>
            <span class="tag">howTo</span>
        </div>

        <button id="start">⚡ Start Scraping</button>

        <div class="footer">Built for <a href="#">Repp</a></div>

        <script src="popup.js"></script>
    </body>
</html>
